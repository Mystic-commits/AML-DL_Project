name: Project validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m scripts.verify_extraction_run artifacts/runs/phase1_extraction_verified_20261101 --portable
      - run: python -m scripts.verify_neural_run artifacts/phase2/development/day2_20261113/fine_tuned_weighted_seed42 --portable
      - run: python -m scripts.verify_neural_run artifacts/phase2/development/day2_20261113/frozen_encoder_weighted_seed42 --portable
